# Netlify hosting (free plan). Same site and API as vercel.json; see README "Hosting on Netlify".
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Installed packages (mongodb, sharp, libphonenumber-js) are imported at the top of each
  # netlify/functions/*.mjs file so Netlify ships them; check with scripts/check-netlify-bundle.cjs.
  directory = "netlify/functions"

# Clean addresses: /story serves story.html (Netlify "pretty URLs"); old .html addresses redirect
# (one rule per page: Netlify placeholders cannot match "/:page.html"). Keep in step with site-pages.cjs.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/story.html"
  to = "/story"
  status = 301
  force = true

[[redirects]]
  from = "/community.html"
  to = "/community"
  status = 301
  force = true

[[redirects]]
  from = "/team.html"
  to = "/team"
  status = 301
  force = true

[[redirects]]
  from = "/faq.html"
  to = "/faq"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/partnerships.html"
  to = "/partnerships"
  status = 301
  force = true

[[redirects]]
  from = "/policy.html"
  to = "/policy"
  status = 301
  force = true

[[redirects]]
  from = "/events.html"
  to = "/events"
  status = 301
  force = true

[[redirects]]
  from = "/join.html"
  to = "/join"
  status = 301
  force = true

[[redirects]]
  from = "/feedback.html"
  to = "/feedback"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
